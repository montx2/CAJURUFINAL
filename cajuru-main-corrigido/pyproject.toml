[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cajuru-a1"
version = "3.3.0"
description = "Auditoria e conciliação conservadora de certificados A1"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["cajuru_a1*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Falhas de sintaxe/import/nome são obrigatórias. Exceções amplas em fronteiras
# de arquivos/Playwright são deliberadas e convertidas em estado de auditoria.
select = ["E4", "E7", "E9", "F"]
